{% extends 'base.html' %}
{% block title %}데이터 관리{% endblock %}
{% block content %}
<h1>데이터 관리</h1>
<div class="workspace items-layout">
  <section class="panel">
    <h2 id="item-form-title">새 항목</h2>
    <form id="item-form" aria-describedby="status" method="post">
      <label for="name">항목 이름</label>
      <input id="name" name="name" required>
      <label for="description">설명</label>
      <textarea id="description" name="description" rows="4"></textarea>
      <div class="actions"><button type="submit" id="save-item" disabled>항목 등록</button><button type="button" id="cancel-edit" class="quiet" hidden>취소</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="panel">
    <h2>항목 목록</h2>
    <p id="item-inventory">불러오는 중…</p>
    <div class="table-scroll">
      <table><thead><tr><th scope="col">항목 이름</th><th scope="col">설명</th><th scope="col">관리</th></tr></thead><tbody id="item-table"></tbody></table>
    </div>
    <button type="button" class="quiet" id="more-items" hidden>더 보기</button>
  </section>
</div>
{% endblock %}
