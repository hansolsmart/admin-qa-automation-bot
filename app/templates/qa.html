{% extends 'base.html' %}
{% block title %}QA 대시보드{% endblock %}
{% block content %}
<h1>QA 대시보드</h1>
<section class="metrics" aria-label="QA 전체 판정 집계">
  <div class="panel metric"><span>통과</span><strong id="pass-count">0</strong></div>
  <div class="panel metric"><span>실패</span><strong id="fail-count">0</strong></div>
  <div class="panel metric"><span>통과율</span><strong id="pass-rate">—</strong></div>
  <div class="panel metric"><span>평균 실행 시간</span><strong id="avg-time">—</strong></div>
</section>
<div class="workspace qa-layout">
  <section class="panel">
    <h2>새 QA 실행</h2>
    <form id="run-form" aria-describedby="status">
      <fieldset><legend>시나리오 선택</legend>
        {% for id, scenario in scenarios.items() %}
        <label class="scenario"><input type="checkbox" name="scenario" value="{{ id }}" {% if id.startswith('TC-N') %}checked{% endif %}><span>{{ scenario[0] }}<small>{{ id }}</small></span></label>
        {% endfor %}
      </fieldset>
      <button type="submit">QA 실행</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="panel">
    <h2>실행 이력</h2>
    <div id="run-list">불러오는 중…</div>
    <button type="button" class="quiet" id="more-runs" hidden>더 보기</button>
    <section id="run-detail" aria-label="실행 상세" hidden></section>
  </section>
</div>
{% endblock %}
