name: QA verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qa:
    # Keep the runner on a distribution supported by the pinned Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m alembic upgrade head && python -m alembic check
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests --junitxml=reports/ci/unit.xml
      - run: python -m pytest qa --junitxml=reports/ci/e2e.xml
        env:
          QA_OUTPUT_DIR: reports/ci/browser
      - run: docker compose build app && docker compose up -d --wait
      - if: failure()
        run: |
          mkdir -p reports/ci
          docker compose logs --no-color > reports/ci/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: reports/
          if-no-files-found: ignore
